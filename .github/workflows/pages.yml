name: Refresh ranking and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: baidu-star-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Route Matiji through its mainland CDN
        shell: bash
        run: |
          mapfile -t MATIJI_CANDIDATES < <(
            {
              curl --fail --silent --max-time 8 \
                'https://doh.pub/resolve?name=www.matiji.net&type=A' \
                -H 'accept: application/dns-json' \
                | jq -r '.Answer[]? | select(.type == 1) | .data' || true
              printf '%s\n' 42.97.39.183 117.68.127.6 113.113.100.43
            } | awk '/^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$/ && !seen[$0]++'
          )

          MATIJI_IP=""
          for candidate in "${MATIJI_CANDIDATES[@]}"; do
            echo "Testing Matiji CDN node: $candidate"
            if curl --fail --silent --show-error \
              --connect-timeout 5 --max-time 15 \
              --resolve "www.matiji.net:443:$candidate" \
              'https://www.matiji.net/exam-back/pc/queryMatchRankListById.do?matchId=548&start=0&limit=1' \
              > /dev/null; then
              MATIJI_IP="$candidate"
              break
            fi
          done

          if [[ -z "$MATIJI_IP" ]]; then
            echo 'No reachable Matiji CDN node' >&2
            exit 1
          fi
          echo "$MATIJI_IP www.matiji.net" | sudo tee -a /etc/hosts
          echo "Using Matiji CDN node: $MATIJI_IP"

      - name: Refresh public ranking snapshot
        run: npm run refresh:data

      - name: Verify snapshot freshness
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          for (const contestId of [548, 547]) {
            const snapshot = JSON.parse(await readFile(`public/data/contest-${contestId}.json`, "utf8"));
            const age = Date.now() - Date.parse(snapshot.generatedAt);
            if (!Number.isFinite(age) || age > 10 * 60 * 1000) {
              throw new Error(`Ranking snapshot ${contestId} is stale: ${snapshot.generatedAt}`);
            }
            console.log(`Fresh snapshot ${contestId}: ${snapshot.generatedAt}, ${snapshot.stats.total} contestants`);
          }
          NODE

      - name: Set Pages base path
        shell: bash
        run: |
          if [[ "${{ github.event.repository.name }}" == "${{ github.repository_owner }}.github.io" ]]; then
            echo "PAGES_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "PAGES_BASE_PATH=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
